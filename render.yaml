services:
  - type: web
    name: ruleflow-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openrouter/google/gemini-2.5-flash-lite
      # Concurrent clause extractions. Lower this if the provider returns 429s.
      - key: LLM_CONCURRENCY
        value: "6"
      - key: CORS_ORIGINS
        value: "*"
      - key: EMAIL_RELAY_URL
        value: https://rule-flow.vercel.app/api/send-otp-email
      - key: EMAIL_RELAY_SECRET
        sync: false
